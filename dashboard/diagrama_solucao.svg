<path d="M800,600 L834,600" stroke="#1c7ed6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#md)"/>
<path d="M1036,488 L1036,410" stroke="#1c7ed6" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#md)"/><text x="1084.0" y="449.0" font-size="12" fill="#1c7ed6" text-anchor="middle" font-weight="600">indicadores</text>
<path d="M700,488 L760,412" stroke="#2b8a3e" stroke-width="2.5" fill="none" stroke-dasharray="2 5" marker-end="url(#mc)"/><text x="826.0" y="456.0" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="600">liga/desliga luzes e ar (relés)</text>
