<line x1="540" y1="738" x2="574" y2="738" stroke="#e8590c" stroke-width="3"/><text x="582" y="742" font-size="13" fill="#243447">fluxo de energia</text>
<line x1="710" y1="738" x2="744" y2="738" stroke="#1c7ed6" stroke-width="3" stroke-dasharray="7 5"/><text x="752" y="742" font-size="13" fill="#243447">dados</text>
<line x1="830" y1="738" x2="864" y2="738" stroke="#2b8a3e" stroke-width="3" stroke-dasharray="2 5"/><text x="872" y="742" font-size="13" fill="#243447">comandos de automação</text>
