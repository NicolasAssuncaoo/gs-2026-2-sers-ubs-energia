<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
<marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
</defs>
<rect width="1280" height="760" fill="#ffffff"/>
<text x="40" y="44" font-size="24" font-weight="800" fill="#0f2a44">Diagrama de blocos — UBS Energia Inteligente (alternativa recomendada A3)</text>
<text x="40" y="68" font-size="14" fill="#5b6b7f">Contribuição SERS ao Neighborhood Action Dashboard · diagrama conceitual, sem circuito elétrico detalhado</text>
<rect x="28" y="100" width="300" height="330" rx="16" fill="none" stroke="#c5d3e3" stroke-dasharray="4 4"/><text x="40" y="92" font-size="13" font-weight="700" fill="#5b6b7f" letter-spacing="1">FONTES DE ENERGIA</text>
<rect x="352" y="100" width="250" height="330" rx="16" fill="none" stroke="#c5d3e3" stroke-dasharray="4 4"/><text x="364" y="92" font-size="13" font-weight="700" fill="#5b6b7f" letter-spacing="1">DISTRIBUIÇÃO E MEDIÇÃO</text>
<rect x="626" y="100" width="300" height="330" rx="16" fill="none" stroke="#c5d3e3" stroke-dasharray="4 4"/><text x="638" y="92" font-size="13" font-weight="700" fill="#5b6b7f" letter-spacing="1">EQUIPAMENTOS CONSUMIDORES</text>
<rect x="950" y="100" width="302" height="330" rx="16" fill="none" stroke="#c5d3e3" stroke-dasharray="4 4"/><text x="962" y="92" font-size="13" font-weight="700" fill="#5b6b7f" letter-spacing="1">INDICADORES NO DASHBOARD</text>
<rect x="28" y="470" width="1224" height="268" rx="16" fill="none" stroke="#c5d3e3" stroke-dasharray="4 4"/><text x="40" y="462" font-size="13" font-weight="700" fill="#5b6b7f" letter-spacing="1">DADOS, LÓGICA E PROCESSAMENTO</text>
<rect x="44" y="116" width="268" height="120" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="58" y="142" font-size="15" font-weight="700" fill="#e8590c">Sistema fotovoltaico 20,88 kWp</text>
<text x="58" y="166" font-size="13.5" fill="#243447">36 módulos de 580 Wp no telhado</text>
<text x="58" y="186" font-size="13.5" fill="#243447">orientação norte, inclinação ~23°</text>
<text x="58" y="206" font-size="13.5" fill="#243447">→ inversor on-grid (CC → CA)</text>
<rect x="44" y="256" width="268" height="150" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="58" y="282" font-size="15" font-weight="700" fill="#e8590c">Rede da distribuidora (SIN)</text>
<text x="58" y="306" font-size="13.5" fill="#243447">Enel SP — baixa tensão (B3)</text>
<text x="58" y="326" font-size="13.5" fill="#243447">supre o que o sol não cobre</text>
<text x="58" y="346" font-size="13.5" fill="#243447">recebe o excedente (créditos,</text>
<text x="58" y="366" font-size="13.5" fill="#243447">Lei 14.300/2022)</text>
<rect x="368" y="116" width="218" height="150" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="382" y="142" font-size="15" font-weight="700" fill="#e8590c">Quadro geral + medidor</text>
<text x="382" y="166" font-size="13.5" fill="#243447">medidor bidirecional</text>
<text x="382" y="186" font-size="13.5" fill="#243447">da distribuidora</text>
<text x="382" y="206" font-size="13.5" fill="#243447">medidores internos por</text>
<text x="382" y="226" font-size="13.5" fill="#243447">circuito (IoT)</text>
<rect x="368" y="286" width="218" height="120" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="382" y="312" font-size="15" font-weight="700" fill="#e8590c">Circuito prioritário</text>
<text x="382" y="336" font-size="13.5" fill="#243447">rede de frio separada,</text>
<text x="382" y="356" font-size="13.5" fill="#243447">com nobreak</text>
<text x="382" y="376" font-size="13.5" fill="#243447">(vacinas nunca desligam)</text>
<rect x="642" y="116" width="268" height="64" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="656" y="142" font-size="15" font-weight="700" fill="#e8590c">Iluminação LED + sensores</text><text x="656" y="164" font-size="13" fill="#243447">120 tubos 18 W · 8 refletores 50 W</text>
<rect x="642" y="192" width="268" height="64" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="656" y="218" font-size="15" font-weight="700" fill="#e8590c">Ar-condicionado inverter</text><text x="656" y="240" font-size="13" fill="#243447">8 splits de 12.000 BTU/h</text>
<rect x="642" y="268" width="268" height="64" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="656" y="294" font-size="15" font-weight="700" fill="#e8590c">TI e equipamentos de saúde</text><text x="656" y="316" font-size="13" fill="#243447">computadores, autoclave, odonto</text>
<rect x="642" y="344" width="268" height="64" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="656" y="370" font-size="15" font-weight="700" fill="#e8590c">Câmaras de vacinas (2)</text><text x="656" y="392" font-size="13" fill="#243447">carga crítica 24 h, de 2 a 8 °C</text>
<rect x="966" y="116" width="270" height="290" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text x="980" y="142" font-size="14.5" font-weight="700" fill="#1c7ed6">Neighborhood Action Dashboard</text>
<text x="982" y="172" font-size="13.5" fill="#243447">● Consumo de energia (kWh/mês)</text>
<text x="982" y="204" font-size="13.5" fill="#243447">● Economia energética (kWh/mês e %)</text>
<text x="982" y="236" font-size="13.5" fill="#243447">● Redução de custo (R$/mês)</text>
<text x="982" y="268" font-size="13.5" fill="#243447">● Participação renovável (%)</text>
<text x="982" y="300" font-size="13.5" fill="#243447">● Emissões evitadas (kg CO₂/ano)</text>
<text x="982" y="332" font-size="13.5" fill="#243447">● Retorno do investimento (anos)</text>
<text x="982" y="364" font-size="13.5" fill="#243447">● Alertas: consumo, rede de frio, solar</text>
<rect x="44" y="488" width="300" height="230" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<text x="58" y="514" font-size="15" font-weight="700" fill="#1c7ed6">Sensores e dados de consumo</text>
<text x="58" y="538" font-size="13.5" fill="#243447">sensores de corrente (SCT-013)</text>
<text x="58" y="558" font-size="13.5" fill="#243447">por circuito</text>
<text x="58" y="578" font-size="13.5" fill="#243447">sensores de presença nas salas</text>
<text x="58" y="598" font-size="13.5" fill="#243447">termômetros das câmaras</text>
<text x="58" y="618" font-size="13.5" fill="#243447">de vacinas</text>
<text x="58" y="638" font-size="13.5" fill="#243447">dados do inversor solar</text>
<text x="58" y="658" font-size="13.5" fill="#243447">(geração e irradiação)</text>
<rect x="380" y="488" width="420" height="230" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<text x="394" y="514" font-size="15" font-weight="700" fill="#1c7ed6">Lógica de monitoramento e automação (ESP32)</text>
<text x="394" y="538" font-size="13.5" fill="#243447">apaga luzes após 10 min sem presença</text>
<text x="394" y="558" font-size="13.5" fill="#243447">desliga o ar fora do horário (7h às 19h) e em sala vazia</text>
<text x="394" y="578" font-size="13.5" fill="#243447">alarme se a vacina sair da faixa de 2 a 8 °C</text>
<text x="394" y="598" font-size="13.5" fill="#243447">alerta: consumo noturno &gt; esperado × 1,2 + 0,3 kW</text>
<text x="394" y="618" font-size="13.5" fill="#243447">alerta: geração &lt; 70% do esperado pela irradiação</text>
<text x="394" y="638" font-size="13.5" fill="#243447">envia leituras a cada 15 min (MQTT/HTTP)</text>
<rect x="836" y="488" width="400" height="230" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<text x="850" y="514" font-size="15" font-weight="700" fill="#1c7ed6">Processamento (Python)</text>
<text x="850" y="538" font-size="13.5" fill="#243447">energia.py: E = P × t / 1000, consumo,</text>
<text x="850" y="558" font-size="13.5" fill="#243447">geração solar, custos, CO₂ e retorno</text>
<text x="850" y="578" font-size="13.5" fill="#243447">monitoramento.py: compara medido × esperado</text>
<text x="850" y="598" font-size="13.5" fill="#243447">e gera as ocorrências</text>
<text x="850" y="618" font-size="13.5" fill="#243447">gerar_dados.py: resultados/ +</text>
<text x="850" y="638" font-size="13.5" fill="#243447">dashboard/dados_energia.js</text>
